# Hosted copy of the DEMO only (sample teams, red DEMO banner), for showing the portal to people
# who aren't at this laptop. Never the real event: that runs on the laptop with start.bat.
# Free plan: it sleeps after 15 idle minutes and starts fresh (new sample data) when it wakes.
# The Docker code runner is off here (no Docker on the host); Python and JavaScript run in each
# visitor's browser instead.
services:
  - type: web
    name: hakrathon-demo
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: DEMO_PORT=$PORT node scripts/demo.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_HOST
        value: 0.0.0.0
      - key: DEMO_DATA_DIR
        value: /tmp/hak-demo
      - key: RUNNER
        value: "off"
      - key: TRUST_PROXY
        value: "1"
      - key: DEMO_PASSWORD
        sync: false
