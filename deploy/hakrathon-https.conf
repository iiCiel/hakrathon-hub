# /etc/systemd/system/hakrathon.service.d/https.conf
# Drop-in on top of hakrathon.service: the portal serves HTTPS itself on 443 and redirects 80 to it,
# still running as the unprivileged user "hak". To undo it: delete this file, daemon-reload, restart.
[Service]
Environment=PORT=443
Environment=HOST=0.0.0.0
Environment=HTTP_REDIRECT_PORT=80
Environment=TLS_CERT=/etc/hakrathon/tls/fullchain.pem
Environment=TLS_KEY=/etc/hakrathon/tls/privkey.pem
# Nothing sits in front of the portal in this setup, so it must not believe X-Forwarded-* headers
# (empty means trust only loopback; otherwise anyone could fake an address to dodge login rate limits).
Environment=TRUST_PROXY=
# Lets a non-root process bind ports below 1024, and nothing else.
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
NoNewPrivileges=true
# No UMask=0077 here: the Docker sandbox runs as "nobody" and must be able to read the project files
# handed to it. Keep other server users out with: chmod 700 on the data folder (DEPLOY-LINUX.md, step 2).
